<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미디어 아트워크</title>
    <style>
        /* 기본 화면 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* 미디어 아트에 어울리는 검은 배경 */
            color: #fff;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 오프닝 화면 (쉽게 텍스트 수정 가능) */
        #opening {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s ease-in-out; /* 부드러운 페이드아웃 효과 */
        }

        #opening h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 5px;
            font-weight: 300;
        }

        #opening p {
            font-size: 1.1rem;
            color: #888;
            cursor: pointer;
            animation: blink 2s infinite; /* 깜빡임 효과 */
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 메인 작품 영역 */
        #main-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 버튼 컨테이너 (우측 하단 구석) */
        #audio-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            opacity: 0; /* 오프닝 땐 숨김 */
            transition: opacity 1s ease-in;
            pointer-events: none; /* 숨겨져 있을 때 클릭 방지 */
        }

        /* 버튼 디자인 설정 */
        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            text-align: left;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        button.active {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 오프닝 화면 -->
    <div id="opening">
        <!-- 아래의 작품 제목과 안내 문구를 자유롭게 수정하세요 -->
        <h1>작품 제목을 입력하세요</h1>
        <p id="start-text">화면을 클릭하여 작품 감상하기</p>
    </div>

    <!-- 메인 작품 화면 -->
    <div id="main-content">
        <!-- 추후 여기에 텍스트 파일 내용이나 이미지, 영상 등을 넣을 수 있습니다 -->
