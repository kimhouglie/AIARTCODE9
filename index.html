<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미디어 아트워크</title>
    <style>
        /* 기본 화면 설정 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* 오프닝 화면 - 오래된 모니터(CRT) 스캔라인 효과 추가 */
        #opening {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            /* 브라운관 모니터 특유의 미세한 가로 줄무늬 효과 */
            background-image: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s ease-in-out;
        }

        /* 메인 타이틀: 과거, 현재, 미래 */
        .crt-text {
            position: relative;
            font-size: 4.5rem;
            font-weight: 300;
            letter-spacing: 12px;
            color: #e5e5e5; /* 완전 쨍한 흰색보다 살짝 톤다운된 흰색이 빈티지합니다 */
            margin-bottom: 30px;
            animation: subtle-flicker 4s infinite; /* 미세한 모니터 깜빡임 */
        }

        /* 파란색 잔상 (왼쪽 강조) */
        .crt-text::before {
            content: attr(data-text); /* HTML의 data-text 값을 가져옴 */
            position: absolute;
            top: 0;
            left: -6px; /* 왼쪽으로 어긋남 */
            color: rgba(60, 160, 255, 0.9); /* 세련된 빈티지 모니터 블루 */
            z-index: -1;
            /* 왼쪽은 진하고 오른쪽으로 갈수록 투명해지는 그라데이션 마스크 */
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
            mix-blend-mode: screen; /* 색상이 빛처럼 자연스럽게 섞임 */
        }

        /* 빨간색 잔상 (오른쪽 강조) */
        .crt-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 6px; /* 오른쪽으로 어긋남 */
            color: rgba(240, 70, 60, 0.9); /* 세련된 빈티지 모니터 레드 */
            z-index: -2;
            /* 오른쪽은 진하고 왼쪽으로 갈수록 투명해지는 그라데이션 마스크 */
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
            mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
            mix-blend-mode: screen;
        }

        /* 미세한 모니터 깜빡임(플리커) 애니메이션 */
        @keyframes subtle-flicker {
            0%, 95%, 100% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
            98% { opacity: 0.85; }
        }

        #opening p {
            font-size: 1.1rem;
            color: #888;
            cursor: pointer;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

            width: 100
